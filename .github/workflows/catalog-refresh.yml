name: Catalog refresh

on:
  repository_dispatch:
    types: [catalog-refresh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.CATALOG_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Require the production database secret
        run: test -n "$DATABASE_URL"

      - name: Apply database migrations
        run: vp run db:migrate

      - name: Synchronize the NASA catalog with retries
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if vp run db:sync; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
