name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_VARIANT_LAUNCH_KEY: ${{ vars.VITE_VARIANT_LAUNCH_KEY }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Skip until Cloudflare credentials are configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."

      - name: Check out repository
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: vp install --frozen-lockfile

      - name: Build and deploy the Worker and static assets
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: vp run deploy
