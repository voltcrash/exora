name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2 # v1.17.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint, and types
        run: vp check

      - name: Run unit tests
        run: vp run -r test

      - name: Install browser used by the journey suite
        run: vp exec --filter website -- playwright install --with-deps chromium

      - name: Run browser tests
        run: vp run website#test:browser

      - name: Build every workspace
        run: vp run -r build

      - name: Audit production dependencies
        run: vp pm audit -- --prod --audit-level=high
