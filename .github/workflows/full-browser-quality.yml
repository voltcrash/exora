name: Full browser quality

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-browser-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec --filter website -- playwright install --with-deps chromium

      - name: Run full desktop and mobile browser tests
        run: vp run website#test:browser:full

      - name: Build the production website
        run: vp run website#build

      - name: Enforce desktop and mobile Lighthouse quality budgets
        run: vp run quality:lighthouse
