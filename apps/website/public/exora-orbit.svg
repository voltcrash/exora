<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Exora orbital observatory</title>
  <defs>
    <radialGradient id="core" cx="42%" cy="40%" r="58%">
      <stop offset="0" stop-color="#e3ffff" />
      <stop offset="0.14" stop-color="#72dce0" />
      <stop offset="0.48" stop-color="#1f6065" />
      <stop offset="1" stop-color="#071214" />
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" />
    </filter>
  </defs>

  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <g transform="rotate(-18 32 32)" fill="none">
      <circle cx="32" cy="32" r="11" stroke="#8be6ea" stroke-opacity=".34" />
      <circle cx="32" cy="32" r="19" stroke="#8be6ea" stroke-opacity=".25" />
      <circle cx="32" cy="32" r="27" stroke="#ffc269" stroke-opacity=".2" />
    </g>

    <circle cx="32" cy="32" r="9" fill="#5ed6dc" opacity=".25" filter="url(#glow)" />
    <circle cx="32" cy="32" r="7" fill="url(#core)" stroke="#8be6ea" stroke-opacity=".62" />

    <g stroke="#071012" stroke-width="1">
      <circle cx="41.5" cy="24" r="2" fill="#d8fafb" />
      <circle cx="48.5" cy="15" r="2" fill="#d8fafb" />
      <circle cx="17" cy="17" r="2.7" fill="#ffb46e" />
      <circle cx="55" cy="41" r="2.3" fill="#ffc269" />
      <circle cx="20" cy="55" r="1.8" fill="#ff7850" />
    </g>
  </g>
</svg>
