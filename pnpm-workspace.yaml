packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@babylonjs/core": ^9.23.0
  "@hono/node-server": ^2.1.1
  "@iwer/devui": ^2.3.0
  "@lhci/cli": ^0.15.1
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vercel/analytics": ^2.0.1
  "@vercel/speed-insights": ^2.0.0
  "@vitejs/plugin-react": ^6.1.0
  # Vite+ requires optional browser providers to match its bundled Vitest exactly.
  "@vitest/browser-playwright": 4.1.11
  hono: ^4.13.5
  iwer: ^2.3.0
  playwright: ^1.62.1
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  zod: ^4.4.3
overrides:
  vite: "catalog:"
  # Advisory patches for transitive development tooling still used by Vite+ and Lighthouse.
  # Drop an entry once its dependents ship the fixed version on their own.
  esbuild@0.27: ^0.28.2
  tmp: ^0.2.7
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@babylonjs/core@9.23.0"
