packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@babylonjs/core": ^9.33.1
  "@hono/node-server": ^2.1.5
  "@lhci/cli": ^0.15.1
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.3.0
  # Vite+ requires optional browser providers to match its bundled Vitest exactly.
  "@vitest/browser-playwright": 5.0.5
  hono: ^4.13.14
  playwright: ^1.64.1
  react: ^19.3.1
  react-dom: ^19.3.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  zod: ^4.6.7
  vitest: 5.0.5
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@babel/core": ^8.1.2
  "@rolldown/plugin-babel": ^0.3.1
  babel-plugin-react-compiler: ^1.0.0
overrides:
  # Advisory patches for transitive development tooling still used by Vite+ and Lighthouse.
  # Drop an entry once its dependents ship the fixed version on their own.
  esbuild@0.27: ^0.28.2
  tmp: ^0.2.7
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
